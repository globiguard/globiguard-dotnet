name: Security Scan

on:
  push:
    branches: [ sol, main, develop ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies with NuGet audit
        run: dotnet restore tests/GlobiGuard.Tests/GlobiGuard.Tests.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Run dotnet list package vulnerabilities
        run: dotnet list src/GlobiGuard/GlobiGuard.csproj package --vulnerable --include-transitive

      - name: Run Roslyn analyzers
        run: dotnet build tests/GlobiGuard.Tests/GlobiGuard.Tests.csproj --configuration Release --no-restore /p:TreatWarningsAsErrors=false /p:EnforceCodeStyleInBuild=true
