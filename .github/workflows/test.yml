name: Test & Lint

on:
  push:
    branches: [ sol, main, develop ]
  pull_request:
    branches: [ sol, main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Run SDK contract tests
        run: dotnet run --project tests/GlobiGuard.Tests/GlobiGuard.Tests.csproj --configuration Release
