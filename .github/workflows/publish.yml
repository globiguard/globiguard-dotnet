name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Verify tag matches package version
        shell: bash
        run: test "v$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/GlobiGuard/GlobiGuard.csproj)" = "$GITHUB_REF_NAME"
      - name: Test and pack
        run: |
          dotnet run --project tests/GlobiGuard.Tests/GlobiGuard.Tests.csproj --configuration Release
          dotnet pack src/GlobiGuard/GlobiGuard.csproj --configuration Release --output artifacts
      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
